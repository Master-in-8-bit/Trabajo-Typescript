<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogo de Productos</title>
    <link rel="stylesheet" href="./styles.css">
    
</head>
<body>

    <!-- Encabezado con el logo, el carrito desplegable y el menú principal. -->
    <header class="header">
        <div class="logo">
            <a href="./index.html"><img src="./src/Logo.png" alt="logo"></a>
        </div>
        <nav>
            <nav class="nav">
                <div class="acciones">

                    <div class="menuC">
                        <button type="button" class="menu-btnC" id="carritoBtn" aria-haspopup="true" aria-expanded="false"><img src="./src/carrito-de-compras.png" alt="Carrito"><span class="carrito-num" id="totalCarrito">0</span></button>
                        <div class="menu-lista carrito-panel" id="carritoLista"></div>
                    </div>


                    
                    <div class="menu">
                        <button type="button" class="menu-btn" id="menuBtn" aria-haspopup="true" aria-expanded="false">Menú ▾</button>
                        <div class="menu-lista" id="menuLista">
                            <a href="./html/adminIni.html" id="enlaceAdmin" hidden>Administrar productos</a>
                            <a href="./html/cuenta.html">Mi cuenta</a>
                            <a href="./html/historial.html">Historial</a>
                            <a href="./html/acerca.html">Acerca de</a>
                            <button type="button" class="salir" id="cerrarSesion">Iniciar sesión</button>
                        </div>
                    </div>
                </div>
            </nav>
        </nav>
    </header>

    <!-- Aquí JavaScript dibuja el catálogo y aplica el filtro de categorías. -->
    <main>
    <div class="filtro">
      <label for="categoria">Categoría</label>
      <select id="categoria"></select>
    </div>
    <section class="grilla" id="tablaProductos"></section>
    </main>




    <script src="./dist/index.js"></script>
    <script src="./dist/menu.js"></script>
</body>
</html>
