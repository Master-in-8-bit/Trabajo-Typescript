<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../styles/registrar.css">
</head>
<body>
    <main class="card">
    <h1>Crear cuenta</h1>
    <p class="sub">Completá tus datos para registrarte.</p>

    <form id="registroForm" novalidate>
      <div class="fila">
        <div class="field">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" autocomplete="given-name">
          <p class="error" id="nombreError"></p>
        </div>
        <div class="field">
          <label for="apellido">Apellido</label>
          <input type="text" id="apellido" autocomplete="family-name">
          <p class="error" id="apellidoError"></p>
        </div>
      </div>

      <div class="field">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" autocomplete="email" placeholder="tucorreo@ejemplo.com">
        <p class="error" id="emailError"></p>
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <div class="input-wrap">
          <input type="password" id="password" autocomplete="new-password" placeholder="Mínimo 6 caracteres">
          <button type="button" class="toggle" id="toggle">Mostrar</button>
        </div>
        <p class="error" id="passError"></p>
      </div>

      <button type="submit" class="submit" id="btn">Crear cuenta</button>
      <p id="mensaje" role="status"></p>
    </form>

    <p class="registro">¿Ya tenés cuenta? <a href="login.html">Iniciá sesión</a></p>
  </main>

  <script src="../js/registrar.js"></script>
</body>
</html>
