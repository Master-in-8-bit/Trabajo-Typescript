<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogo de Productos - Historial</title>
    <link rel="stylesheet" href="../styles/historial.css">
</head>
<body>
    <!-- Encabezado y menú de navegación del historial. -->
    <header class="header">
        <div class="logo">
            <a href="../index.html"><img src="../src/Logo.png" alt="logo"></a>
        </div>
        <nav>
            <nav class="nav">
                <div class="acciones">
                    <li><a href="carrito.html"><img src="../src/carrito-de-compras.png" alt="Carrito"></a></li>
                    <div class="menu">
                        <button type="button" class="menu-btn" id="menuBtn" aria-haspopup="true" aria-expanded="false">Menú ▾</button>
                        <div class="menu-lista" id="menuLista">
                            <a href="adminIni.html" id="enlaceAdmin" hidden>Administrar productos</a>
                            <a href="cuenta.html">Mi cuenta</a>
                            <a href="historial.html">Historial</a>
                            <a href="acerca.html">Acerca de</a>
                            <button type="button" class="salir" id="cerrarSesion">Iniciar sesión</button>
                        </div>
                    </div>
                </div>
            </nav>
        </nav>
    </header>

    <!-- JavaScript carga las compras guardadas y muestra su detalle. -->
    <main>
    <!-- Lista de todas las ventas -->
    <section id="vistaLista"></section>
 
    <!-- Detalle de una venta -->
    <section id="vistaDetalle" hidden>
      <button type="button" class="btn-volver" id="btnVolver">← Volver al historial</button>
      <div class="panel detalle" id="detalle"></div>
    </section>
  </main>


    <script src="../dist/historial.js" defer></script>
    <script src="../dist/menu.js" defer></script>
</body>
</html>
