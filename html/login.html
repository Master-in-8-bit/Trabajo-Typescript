<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../styles/login.css">
    
</head>
<body>
    <main class="card">
    <h1>Iniciar sesión</h1>
    <p class="sub">Ingresá tu correo y contraseña para continuar.</p>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" autocomplete="email" placeholder="tucorreo@ejemplo.com">
        <p class="error" id="emailError"></p>
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <div class="input-wrap">
          <input type="password" id="password" autocomplete="current-password" placeholder="Mínimo 6 caracteres">
          <button type="button" class="toggle" id="toggle">Mostrar</button>
        </div>
        <p class="error" id="passError"></p>
      </div>

      <button type="submit" class="submit" id="btn">Entrar</button>
      <p id="mensaje" role="status"></p>
      <p class="registro">¿No tenés cuenta? <a href="../html/registrar.html">Registrate</a></p>
    </form>
    </main>

    <script src="../js/login.js"></script>
</body>
</html>
